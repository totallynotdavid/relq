[project]
name = "relq-workspace"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "asyncpg-stubs>=0.31.3",
  "basedpyright>=1.39.9",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["tests/snapshots"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportAny = "error"
reportExplicitAny = "error"
reportUnusedCallResult = "none"
extraPaths = ["tests/snapshots"]
include = [
  "packages/relq-core/src",
  "packages/relq-codegen/src",
  "packages/relq-migrate/src",
  "packages/relq-sqlite/src",
  "packages/relq-postgres/src",
  "tests",
]
exclude = [".venv", "dist", "tests/snapshots", "tests/typing/bad_*.py"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
