[project]
name = "relq-workspace"
version = "0.0.0"
requires-python = ">=3.15"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "asyncpg-stubs>=0.31.3",
  "basedpyright>=1.39.9",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py315"
line-length = 100
exclude = ["tests/snapshots", "tests/typing/generated_schema.py"]

[tool.basedpyright]
pythonVersion = "3.15"
typeCheckingMode = "strict"
reportAny = "error"
reportExplicitAny = "error"
reportUnusedCallResult = "none"
include = [
  "packages/relq-core/src",
  "packages/relq-codegen/src",
  "packages/relq-sqlite/src",
  "packages/relq-postgres/src",
  "tests",
]
exclude = [
  ".venv",
  "dist",
  "tests/snapshots",
  "tests/typing/bad_*.py",
  "tests/typing/generated_schema.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
