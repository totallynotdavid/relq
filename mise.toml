[tools]
python = "3.15.0"
uv = "0.13.1"
postgres = "18.6"
oxfmt = "0.74.0"

[tasks.install]
description = "Install every workspace package and dev dependency from uv.lock"
run = "uv sync --locked --all-packages --all-groups"

[tasks.lint]
description = "Check Python lint and formatting, and Markdown, YAML and JSON formatting"
depends = ["lint:*"]

[tasks."lint:py"]
description = "Check Python lint and formatting with ruff"
run = [
  "uv run --locked --all-packages ruff check --no-fix .",
  "uv run --locked --all-packages ruff format --check .",
]

[tasks."lint:fmt"]
description = "Check Markdown, YAML and JSON formatting with oxfmt"
run = "oxfmt --check ."

[tasks.fix]
description = "Apply safe ruff fixes and format Python, Markdown, YAML and JSON"
run = [
  "uv run --locked --all-packages ruff check --fix .",
  "uv run --locked --all-packages ruff format .",
  "oxfmt .",
]

[tasks.typecheck]
description = "Run strict static type checks"
run = "uv run --locked --all-packages basedpyright"

[tasks.test]
description = "Run compiler, SQLite integration, and backend-independent tests"
run = "uv run --locked --all-packages pytest --ignore=tests/integration/postgres"

[tasks."test:integration"]
description = "Run PostgreSQL integration tests against an ephemeral server"
run = "scripts/test-postgres.sh"

[tasks.build]
description = "Build every workspace distribution and verify it installs outside the workspace"
run = [
  "rm -rf dist",
  "uv build --all-packages",
  "scripts/check-install.sh \"$PWD/dist\"",
]

[tasks."verify:release"]
description = "Check that RELEASE_TAG, the package versions and the release notes agree"
run = "scripts/verify-release.sh"

[tasks.check]
description = "Run every gate that needs no service"
depends = ["lint", "typecheck", "test", "build"]
