name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# mise.toml pins PostgreSQL for local development. The runner has no readline,
# so mise cannot build it, and the jobs that need a server use a service.
env:
  MISE_DISABLE_TOOLS: postgres

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run install
      - run: mise run check

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: relq
          POSTGRES_PASSWORD: relq
          POSTGRES_USER: relq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relq -d relq" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      RELQ_TEST_POSTGRES_DSN: postgresql://relq:relq@localhost:5432/relq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run install
      - run: mise run test:integration

  # The package supports Python 3.13 and later. Test the oldest patch of each
  # minor and the newest release, including the version mise pins.
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13.0", "3.14.0", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run install
      - run: mise run test
