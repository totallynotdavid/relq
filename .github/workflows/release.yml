name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest of each supported minor, plus the rc.  The oldest
        # entries are load-bearing, not decoration: 3.13.0 and 3.14.0 each
        # carry a dataclasses bug that later patches fixed, so a bare "3.13" /
        # "3.14" (which resolve to the newest patch) would let the workarounds
        # in _node_value.py and relations.py be deleted without CI noticing.
        python-version: ["3.13.0", "3.13", "3.14.0", "3.14", "3.15.0-rc.1"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: relq
          POSTGRES_PASSWORD: relq
          POSTGRES_USER: relq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relq -d relq" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      RELQ_TEST_POSTGRES_DSN: postgresql://relq:relq@localhost:5432/relq
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-packages
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync basedpyright
      - run: uv run --no-sync pytest

  verify-and-build:
    needs: test
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      # The distributions are interpreter-independent, so they are built once,
      # on the floor the metadata declares.
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-packages
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Verify the release tag and all distribution versions agree
        run: >-
          uv run --no-sync python -c 'from importlib.metadata import version;
          from os import environ; tag = environ["RELEASE_TAG"].removeprefix("v"); versions =
          {version(name) for name in ("relq", "relq-sqlite", "relq-postgres",
          "relq-codegen")}; assert versions == {tag}, f"tag {tag!r} does not
          match distribution versions {versions!r}"'
      - run: uv build --package relq --clear --out-dir dist
      - run: uv build --package relq-sqlite --out-dir dist
      - run: uv build --package relq-postgres --out-dir dist
      - run: uv build --package relq-codegen --out-dir dist
      - name: Verify release artifacts install outside the workspace
        run: scripts/check-install.sh "$PWD/dist"
      - uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/

  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/relq/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist/
      - uses: softprops/action-gh-release@132dbbba49e22bd4837f09b46d32a8edaf6baa58 # v3.0.1
        with:
          name: relq ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
