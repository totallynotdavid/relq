name: Release

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# The release jobs need no PostgreSQL, and the runner cannot build it.
env:
  MISE_DISABLE_TOOLS: postgres

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify-and-build:
    needs: ci
    runs-on: ubuntu-latest
    env:
      # A pull request leaves the tag empty and verify:release uses the manifest version.
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run install
      - run: mise run verify:release
      - run: mise run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/

  publish:
    needs: verify-and-build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/relq/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          # Skip distributions already uploaded to PyPI on reruns.
          skip-existing: true

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: relq ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
