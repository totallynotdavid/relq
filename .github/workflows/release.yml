name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (for example, v0.0.1)
        required: true
        type: string
      package:
        description: Single distribution to publish; use only for PyPI bootstrap or recovery
        required: true
        type: choice
        options:
          - relq
          - relq-sqlite
          - relq-postgres
          - relq-codegen

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: relq
          POSTGRES_PASSWORD: relq
          POSTGRES_USER: relq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relq -d relq" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      RELQ_TEST_POSTGRES_DSN: postgresql://relq:relq@localhost:5432/relq
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.0-rc.1"
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-packages
      - name: Verify the release tag and all distribution versions agree
        run: >-
          uv run --no-sync python -c 'from importlib.metadata import version;
          from os import environ; tag = environ["RELEASE_TAG"].removeprefix("v"); versions =
          {version(name) for name in ("relq", "relq-sqlite", "relq-postgres",
          "relq-codegen")}; assert versions == {tag}, f"tag {tag!r} does not
          match distribution versions {versions!r}"'
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync basedpyright
      - run: uv run --no-sync pytest
      - run: uv build --package relq --clear --out-dir dist
      - run: uv build --package relq-sqlite --out-dir dist
      - run: uv build --package relq-postgres --out-dir dist
      - run: uv build --package relq-codegen --out-dir dist
      - name: Verify release artifacts install outside the workspace
        run: scripts/check-install.sh "$PWD/dist"
      - uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/

  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/relq/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist/
      - name: Select the bootstrap distribution
        if: github.event_name == 'workflow_dispatch'
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            relq|relq-sqlite|relq-postgres|relq-codegen) ;;
            *) echo "unsupported distribution: $PACKAGE" >&2; exit 2 ;;
          esac
          package_prefix=${PACKAGE//-/_}
          shopt -s nullglob
          artifacts=(dist/"$package_prefix"-*)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "no artifacts found for $PACKAGE" >&2
            exit 1
          fi
          mkdir publish-dist
          cp "${artifacts[@]}" publish-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ github.event_name == 'workflow_dispatch' && 'publish-dist/' || 'dist/' }}
