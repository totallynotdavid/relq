name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# The release jobs need no PostgreSQL, and the runner cannot build it.
env:
  MISE_DISABLE_TOOLS: postgres

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify-and-build:
    needs: ci
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run install
      - run: mise run verify:release
      - run: mise run build
      - uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/

  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/relq/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Skip distributions already uploaded to PyPI on reruns.
          skip-existing: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist/
      - uses: softprops/action-gh-release@132dbbba49e22bd4837f09b46d32a8edaf6baa58 # v3.0.1
        with:
          name: relq ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
