[project]
name = "relq-codegen"
version = "0.0.1"
description = "Schema generator for relq SQLite and PostgreSQL declarations"
requires-python = ">=3.15"

[project.optional-dependencies]
postgres = ["asyncpg>=0.31"]

[project.scripts]
relq-codegen = "relq_codegen.__main__:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"
