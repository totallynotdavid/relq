[project]
name = "relq-migrate"
version = "0.1.0"
description = "Forward-only schema migrations for relq SQLite and PostgreSQL applications"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"

[project.optional-dependencies]
postgres = ["asyncpg>=0.31"]
codegen = ["relq-codegen==0.1.0"]

[project.scripts]
relq-migrate = "relq_migrate.__main__:main"

[tool.uv.sources]
relq-codegen = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
