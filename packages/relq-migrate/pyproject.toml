[project]
name = "relq-migrate"
version = "0.0.1"
description = "Forward-only schema migrations for relq SQLite and PostgreSQL applications"
requires-python = ">=3.15"

[project.optional-dependencies]
postgres = ["asyncpg>=0.31"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"
