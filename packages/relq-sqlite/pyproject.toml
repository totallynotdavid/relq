[project]
name = "relq-sqlite"
version = "0.1.0"
description = "SQLite executor for relq's type-safe SQL queries"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["relq==0.1.0"]

[tool.uv.sources]
relq = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
